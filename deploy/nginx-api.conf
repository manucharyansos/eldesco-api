# /etc/nginx/sites-available/api.eldesco.am   (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# After the first start run:  certbot --nginx -d api.eldesco.am   (it adds the HTTPS server block and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name api.eldesco.am;

    root /var/www/eldesco-api/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12M;   # image uploads (the API accepts up to 10 MB per file)

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded images (php artisan storage:link  ->  public/storage)
    location /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
